<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAXIM · QA/QC Insumos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css?v=5" />
</head>
<body style="background:#0b0f14">
  <!-- INTRO: logo + video de fondo. El boton lleva al login. -->
  <section class="intro">
    <div class="fallback"></div>
    <video autoplay muted loop playsinline preload="auto" poster="assets/img/poster.jpg">
      <source src="assets/video/fondo.mp4" type="video/mp4" />
    </video>
    <div class="overlay"></div>
    <div class="contenido">
      <img class="logo-intro" src="assets/img/logo-blanco.png" alt="Maxim Fishing" />
      <div class="tag">QA/QC · Insumos</div>
      <a class="btn" href="login.html">Ingresar</a>
    </div>
  </section>

  <script>
    // Algunos navegadores no arrancan solos el video de fondo.
    (function () {
      var v = document.querySelector('.intro video');
      if (!v) return;
      var p = function () { var r = v.play(); if (r && r.catch) r.catch(function () {}); };
      v.addEventListener('canplay', p);
      document.addEventListener('click', p, { once: true });
      p();
    })();
  </script>
</body>
</html>
