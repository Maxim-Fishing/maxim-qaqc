<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar · MAXIM QA/QC</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="centro">
    <div class="card">
      <div style="text-align:center;margin-bottom:1.4rem">
        <img src="assets/img/logo-blanco.png" alt="Maxim Fishing" style="height:74px;max-width:100%" />
      </div>

      <div class="tabs">
        <button id="tab-visor" class="activo" onclick="cambiarTab('visor')">Visualizar</button>
        <button id="tab-editor" onclick="cambiarTab('editor')">Editar</button>
      </div>

      <!-- VISUALIZADOR -->
      <div id="form-visor">
        <h2>Solo visualizar</h2>
        <p class="sub">Escribe tu nombre para entrar a consultar equipos, herramientas y fichas técnicas.</p>
        <label for="nombre">Tu nombre</label>
        <input id="nombre" type="text" placeholder="Ej: Juan Pérez" autocomplete="name" />
        <button class="btn" onclick="entrarVisor()">Entrar a consultar</button>
      </div>

      <!-- EDITOR -->
      <div id="form-editor" style="display:none">
        <h2>Acceso editor</h2>
        <p class="sub">Solo personal autorizado. Requiere usuario y contraseña.</p>
        <label for="usuario">Usuario</label>
        <input id="usuario" type="text" placeholder="usuario o correo" autocomplete="username" />
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') entrarEditor()" />
        <button class="btn" onclick="entrarEditor()">Ingresar como editor</button>
      </div>

      <div id="msg" class="msg"></div>
      <div id="demo" class="demo-badge" style="display:none">MODO DEMO · datos del Excel · editor con clave "demo"</div>
      <a class="volver" href="index.html">← Volver al inicio</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    if (window.APP_CONFIG.DEMO) document.getElementById('demo').style.display = 'inline-block';

    function cambiarTab(t) {
      document.getElementById('tab-visor').classList.toggle('activo', t === 'visor');
      document.getElementById('tab-editor').classList.toggle('activo', t === 'editor');
      document.getElementById('form-visor').style.display = t === 'visor' ? 'block' : 'none';
      document.getElementById('form-editor').style.display = t === 'editor' ? 'block' : 'none';
      ocultarMsg();
    }
    function mostrarMsg(txt, ok) {
      const m = document.getElementById('msg');
      m.textContent = txt; m.className = 'msg ' + (ok ? 'ok' : 'err');
    }
    function ocultarMsg() { document.getElementById('msg').className = 'msg'; }

    async function entrarVisor() {
      const n = document.getElementById('nombre').value.trim();
      if (!n) { mostrarMsg('Escribe tu nombre para continuar.'); return; }
      await Store.loginVisor(n);
      location.href = 'app.html';
    }
    async function entrarEditor() {
      const u = document.getElementById('usuario').value.trim();
      const c = document.getElementById('clave').value;
      if (!u || !c) { mostrarMsg('Completa usuario y contraseña.'); return; }
      try {
        await Store.loginEditor(u, c);
        location.href = 'app.html';
      } catch (e) { mostrarMsg(e.message || 'No se pudo ingresar.'); }
    }
  </script>
</body>
</html>
