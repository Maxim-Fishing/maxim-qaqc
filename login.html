<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar · MAXIM QA/QC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css?v=3" />
</head>
<body>
  <!-- FONDO DE VIDEO DEL LOGIN:
       Coloca tu video en assets/video/fondo-login.mp4 y se reproducira solo.
       Si no existe, se muestra el fondo degradado de respaldo. -->
  <video id="bgvideo" class="login-bg" autoplay muted loop playsinline preload="auto" poster="assets/img/poster-login.jpg">
    <source src="assets/video/fondo-login.mp4" type="video/mp4" />
  </video>
  <div class="login-bg-fallback"></div>
  <div class="login-bg-overlay"></div>

  <div class="centro">
    <div class="card">
      <div style="text-align:center;margin-bottom:1.4rem">
        <img src="assets/img/logo-blanco.png" alt="Maxim Fishing" style="height:74px;max-width:100%" />
      </div>

      <!-- ACCESO ÚNICO · todos ingresan con usuario y contraseña -->
      <div id="form-login">
        <h2>Iniciar sesión</h2>
        <p class="sub">Ingresa con tu usuario y contraseña para acceder a la información. El sistema reconoce automáticamente si eres visor o editor.</p>
        <label for="usuario">Usuario o correo</label>
        <input id="usuario" type="text" placeholder="usuario o correo" autocomplete="username"
               onkeydown="if(event.key==='Enter') document.getElementById('clave').focus()" />
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter') entrar()" />
        <button class="btn" onclick="entrar()">Ingresar</button>
      </div>

      <div id="msg" class="msg"></div>
      <div id="demo" class="demo-badge" style="display:none">MODO DEMO · datos del Excel · claves de prueba "visor" / "editor"</div>
      <a class="volver" href="index.html">← Volver al inicio</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js?v=2"></script>
  <script src="assets/js/data.js?v=2"></script>
  <script src="assets/js/store.js?v=2"></script>
  <script>
    // Forzar reproduccion del video de fondo (algunos navegadores no autoarrancan)
    (function () {
      var v = document.getElementById('bgvideo');
      if (v) { var p = function(){ var r=v.play(); if(r&&r.catch) r.catch(function(){}); };
        v.addEventListener('canplay', p); document.addEventListener('click', p, {once:true}); p(); }
    })();

    if (window.APP_CONFIG.DEMO) document.getElementById('demo').style.display = 'inline-block';

    function mostrarMsg(txt, ok) {
      const m = document.getElementById('msg');
      m.textContent = txt; m.className = 'msg ' + (ok ? 'ok' : 'err');
    }
    function ocultarMsg() { document.getElementById('msg').className = 'msg'; }

    async function entrar() {
      const u = document.getElementById('usuario').value.trim();
      const c = document.getElementById('clave').value;
      if (!u || !c) { mostrarMsg('Completa usuario y contraseña.'); return; }
      mostrarMsg('Ingresando…', true);
      try {
        await Store.login(u, c);
        location.href = 'app.html';
      } catch (e) { mostrarMsg(e.message || 'No se pudo ingresar.'); }
    }
  </script>
</body>
</html>
